[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tgwhisper"
version = "0.1.0"
description = "Voice-first Telegram task capture for a head nurse"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.15,<4",
  "apscheduler>=3.10,<4",
  "openai>=1.58,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.12,<1",
]

[project.scripts]
tgwhisper = "tgwhisper.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/tgwhisper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
