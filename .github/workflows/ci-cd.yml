name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: tgwhisper-production
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -q

  deploy:
    name: Deploy to VPS
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "$VPS_SSH_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          printf '%s' "$VPS_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          printf '\n' >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload and activate release
        run: |
          ssh -o BatchMode=yes "deploy@${VPS_HOST}" \
            "find /var/lib/tgwhisper-deploy/incoming -maxdepth 1 -type f -name 'tgwhisper-*.whl' -delete"
          scp -o BatchMode=yes dist/*.whl "deploy@${VPS_HOST}:/var/lib/tgwhisper-deploy/incoming/"
          ssh -o BatchMode=yes "deploy@${VPS_HOST}" sudo /usr/local/sbin/deploy-tgwhisper
